<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Menu Types</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/styles.css">
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
        --overlay-bg: rgba(0,0,0,0.4);
        --border-b-items: rgba(255,255,255,0.2);
        --hover-menu-items: rgba(255,255,255,0.2);
      }
    </style>
</head>
<body class="w-full h-svh #848484 flex items-center justify-center overflow-hidden">

    <!-- <<< Header >>> -->
    <header class="fixed w-full max-w-5xl h-17.5 top-0 left-1/2 -translate-x-1/2 z-20 bg-white/5 backdrop-blur-[4px] flex items-center justify-center">
        <h1 class="logo text-white text-3xl">
            DevTrail
        </h1>
    </header>
    <!-- <<< Display menus page >>> -->
    <main class="relative w-full max-w-[1024px] h-svh mx-auto overflow-hidden">
        <div class="absolute w-full h-full inset-0">
            <img src="./assets/images/background-img-1.jpeg" alt="" class="bg-img w-full h-full object-cover object-center transition-all duration-500 delay-500">
        </div>
        <div class="fixed w-full max-w-[1024px] h-full top-1/2 left-1/2 -translate-1/2 z-10 bg-(--overlay-bg)"></div>

        <!-- <<< Menu display buttons >>> -->
        <section class="box-btn fixed top-1/2 left-1/2 -translate-1/2 z-20 pt-20">
            <section class="btn grid-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/grid.webp" alt="" class="">
                </div>
                <p class="">
                    Grid
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn side-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/side.webp" alt="" class="">
                </div>
                <p class="">
                    Side
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn tab-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/tab.webp" alt="" class="">
                </div>
                <p class="">
                    Tab Bar
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn fab-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/fab.webp" alt="" class="">
                </div>
                <p class="">
                    FAB
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn sheet-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/sheet.webp" alt="" class="">
                </div>
                <p class="">
                    Sheet
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn dot-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/dot.webp" alt="" class="">
                </div>
                <p class="">
                    Three Dots
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn rectangular-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/rectangular.webp" alt="" class="">
                </div>
                <p class="">
                    Rectangular
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
            <section class="btn rudder-menu">
                <div class="img-box">
                    <img src="./assets/images/icon/rudder.webp" alt="" class="">
                </div>
                <p class="">
                    Rudder
                    <br>
                    Menu
                </p>
                <div class="active"></div>
            </section>
        </section>

        <!-- <<< Menu Buttons >>> -->
        <section class="">
            <!-- <<< Grid Menu Button >>> -->
            <button class="menu-btn grid-menu absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#grid-menu-icon"></use>
                </svg>
            </button>
            <!-- <<< Side Menu Button >>> -->
            <button class="menu-btn side-menu side-menu-btn absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#side-menu-icon"></use>
                </svg>
            </button>
            <!-- <<< TabBar Menu Button >>> -->
            <button class="menu-btn tab-menu absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#"></use>
                </svg>
            </button>
            <!-- <<< FAB Menu Button >>> -->
            <button class="menu-btn fab-menu absolute bottom-5 right-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#fab-menu-icon"></use>
                </svg>
            </button>
            <!-- <<< Sheet Menu Button >>> -->
            <button class="menu-btn sheet-menu absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#"></use>
                </svg>
            </button>
            <!-- <<< ThreeDot Menu Button >>> -->
            <button class="menu-btn dot-menu absolute top-5 right-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#treedots-menu-icon"></use>
                </svg>
            </button>
            <!-- <<< Rectangular Menu Button >>> -->
            <button class="menu-btn rectangular-menu absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#"></use>
                </svg>
            </button>
            <!-- <<< Rudder Menu Button >>> -->
            <button class="menu-btn rudder-menu absolute top-5 left-5 z-20 text-white">
                <svg class="size-10" viewBox="0 0 24 24" fill="currentcolor">
                    <use href="./assets/icons/icons.svg#"></use>
                </svg>
            </button>
        </section>

        <!-- <<< Menu >>> -->
        <!-- <<< Grid menu >>> -->
        <!-- <<< Side menu >>> -->
        <section id="side-menu" class="absolute w-full max-w-5xl h-full z-30 transition-all duration-500 -left-full">
            <section class="relative w-[280px] h-full px-5 py-10 bg-[#000443] shadow-[0_0_40px_rgba(0,0,0,0.5)_inset]">
                <ul class="flex flex-col mt-28 text-white">
                    <li class="flex gap-4 items-center px-5 py-5 border-b border-(--border-b-items) capitalize rounded-t-[10px] transition-all duration-300 hover:bg-(--hover-menu-items)">
                        <svg class="size-[23px] fill-white">
                            <use href="./assets/icons/icons.svg#home-icon"></use>
                        </svg>
                        home
                    </li>
                    <li class="flex gap-4 items-center px-5 py-5 border-b border-(--border-b-items) capitalize transition-all duration-300 hover:bg-(--hover-menu-items)">
                        <svg class="size-[23px] fill-white">
                            <use href="./assets/icons/icons.svg#project-icon"></use>
                        </svg>
                        projects
                    </li>
                    <li class="flex gap-4 items-center px-5 py-5 border-b border-(--border-b-items) capitalize transition-all duration-300 hover:bg-(--hover-menu-items)">
                        <svg class="size-[23px] fill-white">
                            <use href="./assets/icons/icons.svg#heart-icon"></use>
                        </svg>
                        favorites
                    </li>
                    <li class="flex gap-4 items-center px-5 py-5 border-b border-(--border-b-items) capitalize transition-all duration-300 hover:bg-(--hover-menu-items)">
                        <svg class="size-[23px] fill-white">
                            <use href="./assets/icons/icons.svg#email-icon"></use>
                        </svg>
                        contact us
                    </li>
                    <li class="flex gap-4 items-center px-5 py-5 capitalize rounded-b-[10px] transition-all duration-300 hover:bg-(--hover-menu-items)">
                        <svg class="size-[23px] fill-white">
                            <use href="./assets/icons/icons.svg#settings-icon"></use>
                        </svg>
                        settings
                    </li>
                </ul>
                <button class="side-close-btn absolute top-14 right-8">
                    <svg class="size-7.5">
                        <use href="./assets/icons/icons.svg#close-menu-icon" class="fill-white"></use>
                    </svg>
                </button>
            </section>
        </section>
        <!-- <<< Tab Bar menu >>> -->
        <!-- <<< FAB menu >>> -->
        <!-- <<< Sheet menu >>> -->
        <!-- <<< Three Dots menu >>> -->
        <!-- <<< Rectangular menu >>> -->
        <!-- <<< Rudder menu >>> -->
        

        
    </main>


    <script src="./script/script.js"></script>
    
</body>
</html>
